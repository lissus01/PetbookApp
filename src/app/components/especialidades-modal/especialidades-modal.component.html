<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Gestión de Especialidades</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarModal()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Formulario para agregar nueva especialidad -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Agregar Nueva Especialidad</ion-card-title>
    </ion-card-header>
    
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Nombre*</ion-label>
        <ion-input [(ngModel)]="nuevaEspecialidad.nombre"></ion-input>
      </ion-item>
      
      <ion-item>
        <ion-label position="floating">Descripción</ion-label>
        <ion-textarea [(ngModel)]="nuevaEspecialidad.descripcion"></ion-textarea>
      </ion-item>
      
      <ion-button expand="block" (click)="agregarEspecialidad()" class="ion-margin-top">
        <ion-icon slot="start" name="add"></ion-icon>
        Agregar Especialidad
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Lista de especialidades existentes -->
  <ion-list>
    <ion-list-header>
      <ion-label>Especialidades Registradas</ion-label>
    </ion-list-header>
    
    <ion-item-sliding *ngFor="let esp of especialidades">
      <ion-item>
        <ion-label>
          <h2>{{ esp.nombre }}</h2>
          <p *ngIf="esp.descripcion">{{ esp.descripcion }}</p>
          <p *ngIf="!esp.descripcion" class="text-secondary">Sin descripción</p>
        </ion-label>
      </ion-item>
      
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="eliminarEspecialidad(esp.id, esp.nombre)">
          <ion-icon name="trash" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
    
    <ion-item *ngIf="especialidades.length === 0">
      <ion-label class="ion-text-center">
        No hay especialidades registradas
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
